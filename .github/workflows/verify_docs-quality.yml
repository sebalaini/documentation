name: Verify Docs Quality

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-all-files:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Validate the syntax
        uses: vale-cli/vale-action@v3
        with:
          config: .vale.ini
          glob: docs/**/*.md
